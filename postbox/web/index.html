<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Postbox — Observatory</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <div class="side">
    <div class="wsname">📬 Postbox</div>
    <div class="searchwrap">
      <input id="search" placeholder="Find or message anyone…" autocomplete="off">
      <div class="searchres" id="searchRes" style="display:none"></div>
    </div>
    <div class="scroller">
      <div class="grp"><span class="car">▾</span> Direct messages</div>
      <div id="dmList"></div>
      <div class="navrow" id="navFleet" data-act="showfleet">🤖&nbsp; Fleet</div>
    </div>
    <div class="foot" id="foot"></div>
  </div>
  <div class="main">
    <div class="mhead">
      <h1 id="mTitle"></h1>
      <span class="sub" id="mSub"></span>
      <div class="vas">
        <button class="vasbtn" id="vasBtn" data-act="vas">Viewing as:&nbsp;<b id="vasName">You</b> <span class="car">▾</span></button>
        <div class="vasmenu" id="vasMenu"></div>
      </div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="composer" id="composer">
      <div class="sendstatus" id="sendStatus"></div>
      <div class="cbox">
        <div class="cinput">
          <input id="cinput" placeholder="Message…" autocomplete="off">
          <button class="send" id="send" data-act="send" title="Send">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
