[project]
name = "postbox"
version = "0.1.0"
description = "Local email-for-AI-agents messaging platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.1",
    "aiosqlite>=0.20",
    "pydantic>=2.6",
    "mcp>=1.2",
    "httpx>=0.27",
    "httpx-sse>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "anyio>=4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
